name: Pact consumer test and publish

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App version used for the Docker image tag / Helm deploy.
        required: true
        type: string
  workflow_call:
    inputs:
      app_version:
        description: App version used for the Docker image tag / Helm deploy.
        required: true
        type: string
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
      PACT_BROKER_URL:
        required: true
      HMPPS_PACT_BROKER_USERNAME:
        required: true
      HMPPS_PACT_BROKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  pact_test_publish:
    name: Pact consumer test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Run pact tests
        run: ./gradlew pactTest
      - name: Upload the test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-test-results
          path: |
            build/test-results
            build/reports/tests
      - name: Publish pacts
        run: ./gradlew pactPublish
        env:
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
