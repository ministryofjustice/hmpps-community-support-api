# Full local stack incl. the UI, pulled from GHCR (no local UI checkout/build needed).
#
# Use this when you want to run hmpps-community-support-api locally (e.g. in IntelliJ,
# `local` Spring profile) and exercise it through the latest published UI image, with real
# hmpps-auth login (incl. a working delius test user). If you need to test local UI source
# changes, use docker-compose-ui.yml instead.
#
# Usage:
#   docker compose -f docker-compose-ui-ghcr.yml pull community-support-ui
#   docker compose -f docker-compose-ui-ghcr.yml up
#
# Then start the API from IntelliJ with the `local` Spring profile (it will use the
# dependencies started by this file), and browse to http://localhost:3000.
#
# Log in with username "bernard.beaks" / password "secret" (a delius-sourced wiremock test
# user - HMPPS Auth automatically grants delius-sourced users ROLE_PROBATION, which the UI
# requires). The plain "AUTH_USER" test account has no roles and will be rejected by the UI.
#
# Compose can expose ports to localhost, but it cannot create host OS DNS aliases.
# The UI's browser-facing HMPPS_AUTH_URL is the same hostname used inside the docker
# network ("hmpps-auth"), so add this host alias on your Mac so both resolve the same way:
#   127.0.0.1 hmpps-auth
services:
  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    depends_on:
      - auth-db
    container_name: hmpps-auth-community-support-api
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/auth/health" ]
    environment:
      - SERVER_PORT=8090
      - SPRING_PROFILES_ACTIVE=dev,delius,local-postgres
      - SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL=false
      - SPRING_H2_CONSOLE_SETTINGS_WEBALLOWOTHERS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth-db
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0
      - DELIUS_ENABLED=true
      - DELIUS_ENDPOINT_URL=http://wiremock:8080/delius
      - DELIUS_ENDPOINT_TIMEOUT=1s
      - DELIUS_CLIENT_CLIENT-ID=delius-auth-api-client
      - DELIUS_CLIENT_CLIENT-SECRET=delius-auth-api-client
      - MANAGE_USERS_API_ENABLED=true
      - MANAGE_USERS_API_ENDPOINT_URL=http://hmpps-manage-users:8096

  hmpps-manage-users:
    image: ghcr.io/ministryofjustice/hmpps-manage-users-api:latest
    networks:
      - hmpps
    container_name: hmpps-manage-users-community-support-api
    ports:
      - "8096:8096"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8096/health" ]
    environment:
      - SERVER_PORT=8096
      - HMPPS_AUTH_ENDPOINT_URL=http://hmpps-auth:8090/auth
      - API_BASE_URL_OAUTH=http://hmpps-auth:8090/auth
      - SPRING_PROFILES_ACTIVE=dev
      - EXTERNAL_USERS_ENDPOINT_URL=http://hmpps-external-users-api:8098
      - NOMIS_ENDPOINT_URL=http://nomis-user-roles-api:8097
      - DELIUS_ENDPOINT_URL=http://wiremock:8080/delius
      - AUTHORIZATION_SERVER_TOKEN_ENDPOINT_URL=http://hmpps-auth:8090/auth/oauth/token
      # the `dev` profile's own application-dev.yml hardcodes a datasource pointing at
      # localhost:5433/manage-users-db - override to point at our own db container instead
      - SPRING_DATASOURCE_URL=jdbc:postgresql://manage-users-db:5432/manage-users-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin_password
      - HMPPS_SQS_PROVIDER=localstack
      - HMPPS_SQS_LOCALSTACKURL=http://localstack:4566
      # each downstream integration defaults to disabled - must be explicitly enabled with
      # matching client_credentials clients registered in hmpps-auth's own seed data
      - HMPPS_AUTH_ENABLED=true
      - HMPPS_AUTH_CLIENT_CLIENT-ID=hmpps-manage-users-api
      - HMPPS_AUTH_CLIENT_CLIENT-SECRET=clientsecret
      - EXTERNAL_USERS_ENABLED=true
      - EXTERNAL_USERS_CLIENT_CLIENT-ID=manage-users-api-ext-users-client
      - EXTERNAL_USERS_CLIENT_CLIENT-SECRET=clientsecret
      - NOMIS_ENABLED=true
      - NOMIS_CLIENT_CLIENT-ID=manage-users-api-nomis-client
      - NOMIS_CLIENT_CLIENT-SECRET=clientsecret
      - DELIUS_ENABLED=true
      - DELIUS_CLIENT_CLIENT-ID=manage-users-api-delius-client
      - DELIUS_CLIENT_CLIENT-SECRET=clientsecret
    depends_on:
      hmpps-auth:
        condition: service_started
      nomis-user-roles-api:
        condition: service_started
      hmpps-external-users-api:
        condition: service_started
      manage-users-db:
        condition: service_healthy

  manage-users-db:
    image: postgres:18
    networks:
      - hmpps
    container_name: manage-users-db-community-support-api
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_USER=admin
      - POSTGRES_DB=manage-users-db
    healthcheck:
      test: pg_isready -d manage-users-db -U admin

  nomis-user-roles-api:
    image: ghcr.io/ministryofjustice/nomis-user-roles-api:latest
    networks:
      - hmpps
    container_name: nomis-user-roles-community-support-api
    depends_on:
      - hmpps-auth
    ports:
      - "8097:8097"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8097/health" ]
    environment:
      - SERVER_PORT=8097
      - SPRING_PROFILES_ACTIVE=dev
      - API_BASE_URL_OAUTH=http://hmpps-auth:8090/auth

  hmpps-external-users-api:
    image: ghcr.io/ministryofjustice/hmpps-external-users-api:latest
    networks:
      - hmpps
    container_name: hmpps-external-users-community-support-api
    depends_on:
      - auth-db
      - hmpps-auth
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health/ping"]
    environment:
      - SERVER_PORT=8098
      - SPRING_PROFILES_ACTIVE=dev
      - API_BASE_URL_OAUTH=http://hmpps-auth:8090/auth
      - SPRING_R2DBC_URL=r2dbc:postgresql://auth-db:5432/auth-db?sslmode=prefer
      - SPRING_FLYWAY_URL=jdbc:postgresql://auth-db:5432/auth-db?sslmode=prefer
      - SPRING_R2DBC_USERNAME=admin
      - SPRING_R2DBC_PASSWORD=admin_password
      - HMPPS_SQS_PROVIDER=localstack
      - HMPPS_SQS_LOCALSTACKURL=http://localstack:4566

  auth-db:
    image: postgres:18
    networks:
      - hmpps
    restart: always
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_USER=admin
      - POSTGRES_DB=auth-db
    healthcheck:
      test: pg_isready -d auth-db

  postgresql:
    image: postgres:18.6
    container_name: postgres-community-support-api
    networks:
      - hmpps
    restart: always
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD", "pg_isready", "--username=admin", "--dbname=postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password

  wiremock:
    image: wiremock/wiremock:3.13.2
    networks:
      - hmpps
    restart: always
    ports:
      - "9091:8080"
    volumes:
      - ./wiremock_mappings:/home/wiremock/mappings
    command: >
      --verbose

  localstack:
    image: localstack/localstack:4
    networks:
      - hmpps
    container_name: hmpps-com-support-localstack-community-support-api
    ports:
      - "4566:4566"
      - "8999:8080"
    environment:
      - SERVICES=sns,sqs
      - DEBUG=${DEBUG- }
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  community-support-ui:
    image: ghcr.io/ministryofjustice/hmpps-community-support-ui:latest
    container_name: community-support-ui
    networks:
      - hmpps
    restart: always
    depends_on:
      - hmpps-auth
      - wiremock
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NO_HTTPS=true
      - PRODUCT_ID=UNASSIGNED
      - SESSION_SECRET=insecure-local-dev-session-secret
      - INGRESS_URL=http://localhost:3000
      - REDIS_ENABLED=false
      - REDIS_HOST=unused-redis-disabled
      - ENVIRONMENT_NAME=local
      # HMPPS Auth: same hostname used inside the docker network and from your browser,
      # see the /etc/hosts note above.
      - HMPPS_AUTH_URL=http://hmpps-auth:8090/auth
      - HMPPS_AUTH_EXTERNAL_URL=http://hmpps-auth:8090/auth
      # Real client registrations seeded into every hmpps-auth image - not the "clientid"
      # default in the UI's own .env, which isn't a registered client against this image.
      - AUTH_CODE_CLIENT_ID=hmpps-community-support-ui-1
      - AUTH_CODE_CLIENT_SECRET=clientsecret
      - CLIENT_CREDS_CLIENT_ID=hmpps-community-support-ipb-ui-client-1
      - CLIENT_CREDS_CLIENT_SECRET=clientsecret
      # No local stub for the (deprecated, mostly unused) token verification API, so disable it.
      - TOKEN_VERIFICATION_ENABLED=false
      - TOKEN_VERIFICATION_API_URL=http://wiremock:8080/verification
      - PRISON_API_URL=http://wiremock:8080
      # host.docker.internal reaches services running on your Mac host, e.g. the API
      # started in IntelliJ on its default port 8080 with the `local` Spring profile.
      - COMMUNITY_SUPPORT_API_URL=http://host.docker.internal:8080

networks:
  hmpps:
